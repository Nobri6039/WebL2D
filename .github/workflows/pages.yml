name: Deploy WebL2D to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh model manifest
        run: python3 scan_models.py

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R index.html css js vendor assets L2d_model L2d_models models.json README.md RELEASE_NOTES.md THIRD_PARTY_NOTICES.md .nojekyll _site/
          # 本地启动脚本一并带上，方便下载后本地运行
          cp -R start.cmd server.py scan_models.py _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 避免 Pages 部署接口在 artifact 刚上传完时还查不到（Found 0 artifacts）
      - name: Wait for artifact indexing
        run: sleep 8

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
